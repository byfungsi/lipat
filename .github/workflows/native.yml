name: Build native engine
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run build:native:android
      - uses: actions/upload-artifact@v4
        with:
          name: lipat-android-engine
          path: packages/lipat-native/native/android/src/main/jniLibs/
          if-no-files-found: error
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm run build:wasm && npm run build -w @byfungsi/lipat && npm run build -w @byfungsi/lipat-native
      - run: npx expo prebuild --platform android --no-install
        working-directory: examples/native-demo
      - run: ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon
        working-directory: examples/native-demo/android
        env:
          NODE_ENV: production
