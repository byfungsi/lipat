name: Verify Lipat
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: npm run verify
      - run: npm run schemas:generate && git diff --exit-code packages/agent/src/schemas.json
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:browser
        timeout-minutes: 5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: npm run verify:openxml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements-interop.txt
      - run: npm run verify:interop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lipat-verification
          path: artifacts/
